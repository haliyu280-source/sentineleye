[project]
name = "sentineleye"
version = "1.0.0"
description = "Centralised Linux server monitoring with lightweight agents"
authors = [{ name = "Ali Khaleel Hassan" }]
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "agent/tests"]
pythonpath = [".", "agent"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:sentineleye.*"]
